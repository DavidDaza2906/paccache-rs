name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed rust pacman-contrib gawk git

      - uses: actions/checkout@v4

      # The tests check permissions (unreadable directories, `test -w`, sudo
      # detection), so they must not run as root.
      - name: Create an unprivileged user
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Build
        run: runuser -u builder -- cargo build --locked --release

      - name: Clippy
        run: runuser -u builder -- cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: runuser -u builder -- env TMPDIR=/tmp cargo test --locked --release

      - name: Long differential tests (vercmp, pacsort, gawk, package cache)
        run: runuser -u builder -- env TMPDIR=/tmp cargo test --locked --release -- --include-ignored --skip dump_fixture
